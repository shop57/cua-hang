<!DOCTYPE html>
<html lang="vi">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JNCCMVM7RJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản phẩm — Daily Mart</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <meta name="description" content="Chi tiết sản phẩm.">
  <link rel="canonical" href="https://shop57.github.io/cua-hang/product.html">
  <script>
    // Mỗi sản phẩm có URL riêng (?id=...), nên canonical phải khớp
    // đúng URL hiện tại (bao gồm query string) thay vì trỏ chung về
    // product.html không có id.
    (function () {
      try {
        var link = document.querySelector('link[rel="canonical"]');
        if (link && window.location.search) {
          link.setAttribute(
            "href",
            "https://shop57.github.io/cua-hang/" + window.location.pathname.split("/").pop() + window.location.search
          );
        }
      } catch (e) {}
    })();
  </script>
  <meta property="og:type" content="product">
  <meta property="og:title" content="Sản phẩm — Daily Mart">
  <meta property="og:site_name" content="Daily Mart">
  <meta property="og:description" content="Chi tiết sản phẩm.">
  <meta property="og:image" content="https://picsum.photos/seed/dailymart-og/1200/630">
  <script>
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===================== Header ===================== -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="Trang chủ Daily Mart">
        <img src="img/logo.png" alt="Daily Mart" class="logo-img">
      </a>
      <nav class="main-nav" aria-label="Điều hướng chính">
        <a href="index.html">Trang chủ</a>
      </nav>
      <div style="flex:1;"></div>
      <div class="header-actions">
        <a href="index.html" class="icon-btn" aria-label="Quay lại cửa hàng">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </a>
        <button type="button" class="icon-btn" data-cart-open aria-label="Mở giỏ hàng">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-badge" data-cart-count>0</span>
        </button>
        <div class="settings-wrap">
          <button type="button" class="icon-btn" id="settingsToggle" aria-haspopup="true" aria-expanded="false" aria-label="Cài đặt">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <div class="settings-panel" id="settingsPanel" hidden>
            <div class="settings-row">
              <span>Chế độ tối</span>
              <button type="button" class="theme-switch" id="themeSwitch" role="switch" aria-checked="false" aria-label="Chuyển giao diện sáng/tối">
                <span class="theme-switch-thumb"></span>
              </button>
            </div>
            <div class="settings-divider"></div>
            <a href="admin.html" class="settings-link">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              Quản trị
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ===================== Main ===================== -->
  <main>
    <div class="container" id="productDetailWrap">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Trang chủ</a> / <span id="breadcrumbName">Sản phẩm</span>
      </nav>

      <div class="product-detail">
        <!-- Gallery -->
        <div>
          <div class="gallery-main">
            <img id="galleryMainImg" src="" alt="" width="700" height="700">
          </div>
          <div class="gallery-thumbs" id="galleryThumbs"></div>
          <div class="pd-videos" id="pdVideos" hidden>
            <h3>Video sản phẩm</h3>
            <div class="pd-video-list" id="pdVideoList"></div>
          </div>
        </div>

        <!-- Info -->
        <div>
          <p class="pd-category" id="pdCategory"></p>
          <h1 class="pd-title" id="pdTitle"></h1>
          <div class="pd-rating">
            <span class="stars" id="pdStars" aria-hidden="true"></span>
            <span id="pdRatingText"></span>
            <span class="pd-views" id="pdViews"></span>
            <span class="pd-stock-badge" id="pdStockBadge"></span>
          </div>
          <div class="pd-price-row">
            <span class="pd-price-current" id="pdPriceCurrent"></span>
            <span class="pd-price-old" id="pdPriceOld"></span>
            <span class="pd-discount-badge" id="pdDiscountBadge"></span>
          </div>

          <p class="pd-desc" id="pdDescription"></p>

          <div class="pd-options" id="pdOptions" hidden>
            <p class="pd-options-label" id="pdOptionsLabel"></p>
            <div class="pd-options-list" id="pdOptionsList"></div>
          </div>

          <div class="pd-actions-row">
            <div class="qty-control" aria-label="Chọn số lượng">
              <button type="button" id="qtyDec" aria-label="Giảm số lượng">−</button>
              <span id="qtyValue">1</span>
              <button type="button" id="qtyInc" aria-label="Tăng số lượng">+</button>
            </div>
            <div class="pd-buttons">
              <button type="button" class="btn btn-secondary btn-lg" id="addToCartBtn">Thêm vào giỏ</button>
              <button type="button" class="btn btn-primary btn-lg" id="buyNowBtn">Mua ngay</button>
            </div>
          </div>
        </div>
      </div>

      <!-- ===================== Reviews (đánh giá sao) ===================== -->
      <section class="community-section reveal" id="reviewsSection" aria-labelledby="reviewsHeading">
        <h2 id="reviewsHeading">Đánh giá sản phẩm</h2>
        <p class="hint">Đánh giá thực tế từ khách hàng — không có đánh giá ảo.</p>

        <div class="review-summary">
          <div>
            <div class="review-summary-score" id="reviewAvgScore">0.0</div>
            <div class="review-summary-stars" id="reviewAvgStars" aria-hidden="true"></div>
          </div>
          <div class="review-summary-count" id="reviewCountText">Chưa có đánh giá nào</div>
          <div style="flex:1;"></div>
          <button type="button" class="btn btn-secondary" id="reviewToggleFormBtn">Viết đánh giá</button>
        </div>

        <form class="community-form" id="reviewForm" hidden>
          <div class="form-field" style="margin-bottom:10px;">
            <label>Chấm sao *</label>
            <div class="star-picker" id="reviewStarPicker" role="radiogroup" aria-label="Chọn số sao">
              <button type="button" data-star="1" aria-label="1 sao">★</button>
              <button type="button" data-star="2" aria-label="2 sao">★</button>
              <button type="button" data-star="3" aria-label="3 sao">★</button>
              <button type="button" data-star="4" aria-label="4 sao">★</button>
              <button type="button" data-star="5" aria-label="5 sao">★</button>
            </div>
          </div>
          <div class="community-form-row">
            <div class="form-field" style="flex:1; min-width:180px; margin-bottom:0;">
              <label for="reviewName">Tên của bạn *</label>
              <input type="text" id="reviewName" maxlength="60" placeholder="VD: Minh Anh" required>
            </div>
          </div>
          <div class="form-field" style="margin-top:10px; margin-bottom:0;">
            <label for="reviewMessage">Nhận xét (không bắt buộc)</label>
            <textarea id="reviewMessage" rows="3" maxlength="500" placeholder="Sản phẩm dùng thế nào?"></textarea>
          </div>
          <!-- Honeypot chống bot — người dùng thật không nhìn thấy trường này -->
          <div class="honeypot-field" aria-hidden="true">
            <label for="reviewWebsite">Website</label>
            <input type="text" id="reviewWebsite" name="website" tabindex="-1" autocomplete="off">
          </div>
          <p id="reviewFormError" style="color:#e5484d; font-size:0.85rem; display:none; margin:10px 0 0;"></p>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="reviewSubmitBtn">Gửi đánh giá</button>
          </div>
        </form>

        <div id="reviewsList"></div>
      </section>

      <!-- ===================== Comments (bình luận) ===================== -->
      <section class="community-section reveal" id="commentsSection" aria-labelledby="commentsHeading">
        <h2 id="commentsHeading">Bình luận <span id="commentsCount"></span></h2>
        <p class="hint">Trao đổi, hỏi đáp về sản phẩm này.</p>

        <form class="community-form" id="commentForm">
          <div class="community-form-row">
            <div class="form-field" style="flex:1; min-width:180px; margin-bottom:0;">
              <label for="commentName">Tên của bạn *</label>
              <input type="text" id="commentName" maxlength="60" placeholder="VD: Minh Anh" required>
            </div>
          </div>
          <div class="form-field" style="margin-top:10px; margin-bottom:0;">
            <label for="commentMessage">Bình luận *</label>
            <textarea id="commentMessage" rows="3" maxlength="500" placeholder="Viết bình luận của bạn..." required></textarea>
          </div>
          <!-- Honeypot chống bot -->
          <div class="honeypot-field" aria-hidden="true">
            <label for="commentWebsite">Website</label>
            <input type="text" id="commentWebsite" name="website" tabindex="-1" autocomplete="off">
          </div>
          <p id="commentFormError" style="color:#e5484d; font-size:0.85rem; display:none; margin:10px 0 0;"></p>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="commentSubmitBtn">Gửi bình luận</button>
          </div>
        </form>

        <div id="commentsList"></div>
      </section>
    </div>
  </main>

  <!-- ===================== Cart drawer ===================== -->
  <div class="cart-overlay" id="cartOverlay" data-cart-close></div>
  <aside class="cart-drawer" id="cartDrawer" aria-label="Giỏ hàng">
    <div class="cart-drawer-header">
      <h2>Giỏ hàng của bạn</h2>
      <button type="button" class="icon-btn" data-cart-close aria-label="Đóng giỏ hàng">✕</button>
    </div>
    <div class="cart-drawer-body" id="cartDrawerBody"></div>
    <div class="cart-drawer-footer" id="cartDrawerFooter" style="display:none;">
      <div class="cart-total-row">
        <span>Tổng cộng</span>
        <span id="cartDrawerTotal">$0.00</span>
      </div>
      <a href="cart.html" class="btn btn-primary btn-block btn-lg">Xem giỏ hàng</a>
      <button type="button" class="cart-clear-link" id="cartClearBtn">Xoá giỏ hàng</button>
    </div>
  </aside>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/products.js"></script>
  <script src="js/store.js"></script>
  <script src="js/views.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/product.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
