<!DOCTYPE html>
<html lang="vi">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng — Daily Mart</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <meta name="description" content="Xem lại sản phẩm trong giỏ hàng của bạn.">
  <meta name="robots" content="noindex">
  <script>
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .cart-page { padding: 24px 0 64px; }
    .cart-page-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 32px; align-items: start; }
    @media (max-width: 900px) { .cart-page-grid { grid-template-columns: 1fr; } }
    .cart-page-table { width: 100%; border-collapse: collapse; }
    .cart-page-table th { text-align: left; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .cart-page-table td { padding: 16px 0; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .cpt-product { display: flex; align-items: center; gap: 12px; }
    .cpt-product img { width: 60px; height: 60px; border-radius: var(--radius-sm); object-fit: cover; border: 1px solid var(--border); }
    .cpt-product-name { font-weight: 600; font-size: 0.92rem; }
    .cpt-price, .cpt-subtotal { font-family: var(--font-mono); font-size: 0.9rem; }
    .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
    .summary-card h2 { font-size: 1.1rem; margin-bottom: 16px; }
    .summary-row { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 8px 0; color: var(--text-muted); }
    .summary-row.total { color: var(--text); font-weight: 700; font-size: 1.05rem; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 14px; font-family: var(--font-mono); }
    .demo-note { font-size: 0.78rem; color: var(--text-muted); margin-top: 10px; text-align: center; }
    .order-success { text-align: center; padding: 60px 20px; }
    .order-success .check { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-light); color: var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; font-size: 1.8rem; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="Trang chủ Daily Mart">
        <img src="img/logo.png" alt="Daily Mart" class="logo-img">
      </a>
      <div style="flex:1;"></div>
      <div class="header-actions">
        <a href="index.html" class="btn btn-secondary">Tiếp tục mua sắm</a>
        <div class="settings-wrap">
          <button type="button" class="icon-btn" id="settingsToggle" aria-haspopup="true" aria-expanded="false" aria-label="Cài đặt">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <div class="settings-panel" id="settingsPanel" hidden>
            <div class="settings-row">
              <span>Chế độ tối</span>
              <button type="button" class="theme-switch" id="themeSwitch" role="switch" aria-checked="false" aria-label="Chuyển giao diện sáng/tối">
                <span class="theme-switch-thumb"></span>
              </button>
            </div>
            <div class="settings-divider"></div>
            <a href="admin.html" class="settings-link">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              Quản trị
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="container cart-page">
      <h1 style="margin-bottom:20px;">Giỏ hàng của bạn</h1>
      <div id="cartPageContent"></div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/products.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/settings.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function renderCartPage() {
      Cart.load();
      const wrap = document.getElementById("cartPageContent");

      if (Cart.items.length === 0) {
        wrap.innerHTML = `
          <div class="order-success">
            <p style="color:var(--text-muted); margin-bottom:20px;">Giỏ hàng của bạn đang trống.</p>
            <a href="index.html" class="btn btn-primary">Xem sản phẩm</a>
          </div>`;
        return;
      }

      const rows = Cart.items.map((item) => {
        const p = ProductStore.getById(item.id);
        if (!p) return "";
        return `
          <tr data-row-id="${p.id}">
            <td>
              <div class="cpt-product">
                <img src="${p.image}" alt="${escapeHtml(p.name)}" loading="lazy">
                <span class="cpt-product-name">${escapeHtml(p.name)}</span>
              </div>
            </td>
            <td class="cpt-price">${formatVND(p.price)}</td>
            <td>
              <div class="qty-control qty-control-sm">
                <button type="button" data-cart-dec="${p.id}" aria-label="Giảm số lượng">−</button>
                <span>${item.qty}</span>
                <button type="button" data-cart-inc="${p.id}" aria-label="Tăng số lượng">+</button>
              </div>
            </td>
            <td class="cpt-subtotal">${formatVND(p.price * item.qty)}</td>
            <td><button type="button" class="cart-line-remove" data-cart-remove="${p.id}" aria-label="Xoá ${escapeHtml(p.name)}">✕</button></td>
          </tr>`;
      }).join("");

      const total = Cart.totalPrice();
      wrap.innerHTML = `
        <div class="cart-page-grid">
          <table class="cart-page-table">
            <thead><tr><th>Sản phẩm</th><th>Giá</th><th>SL</th><th>Tạm tính</th><th></th></tr></thead>
            <tbody id="cartPageBody">${rows}</tbody>
          </table>
          <div class="summary-card">
            <h2>Tóm tắt đơn hàng</h2>
            <div class="summary-row"><span>Tạm tính</span><span>${formatVND(total)}</span></div>
            <div class="summary-row total"><span>Tổng cộng</span><span>${formatVND(total)}</span></div>
            <a href="checkout.html" class="btn btn-primary btn-block btn-lg" id="checkoutBtn" style="margin-top:16px;">Tiến hành thanh toán</a>
            <p class="demo-note">Thanh toán bằng chuyển khoản ngân hàng — không cần đăng ký hay đăng nhập.</p>
          </div>
        </div>`;

      document.getElementById("cartPageBody").addEventListener("click", (e) => {
        const inc = e.target.getAttribute?.("data-cart-inc");
        const dec = e.target.getAttribute?.("data-cart-dec");
        const rem = e.target.getAttribute?.("data-cart-remove");
        if (inc) { const item = Cart.items.find(i => i.id === Number(inc)); if (item) Cart.setQty(item.id, item.qty + 1); renderCartPage(); }
        else if (dec) { const item = Cart.items.find(i => i.id === Number(dec)); if (item) Cart.setQty(item.id, item.qty - 1); renderCartPage(); }
        else if (rem) { Cart.remove(Number(rem)); renderCartPage(); }
      });
    }

    document.addEventListener("DOMContentLoaded", renderCartPage);
    window.addEventListener("products:changed", renderCartPage);
  </script>
</body>
</html>
